name: CI

on:
  workflow_dispatch:
  push:
    branches: [agent-headless-sync, dev, main]
  pull_request:
    branches: [agent-headless-sync, dev, main]

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Install workflow prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            coreutils \
            dash \
            findutils \
            gawk \
            grep \
            jq \
            openssh-client \
            openssh-server \
            sed \
            util-linux
          sudo install -d -m 0755 /run/sshd
          command -v awk >/dev/null
          command -v bash >/dev/null
          command -v cat >/dev/null
          command -v chmod >/dev/null
          command -v cp >/dev/null
          command -v dd >/dev/null
          command -v dirname >/dev/null
          command -v find >/dev/null
          command -v go >/dev/null
          command -v grep >/dev/null
          command -v head >/dev/null
          command -v id >/dev/null
          command -v ln >/dev/null
          command -v mkdir >/dev/null
          command -v mktemp >/dev/null
          command -v nohup >/dev/null
          command -v printenv >/dev/null
          command -v rm >/dev/null
          command -v script >/dev/null
          command -v sed >/dev/null
          command -v seq >/dev/null
          command -v sh >/dev/null
          command -v sha256sum >/dev/null
          command -v sleep >/dev/null
          command -v ssh >/dev/null
          command -v ssh-keygen >/dev/null
          command -v touch >/dev/null
          command -v tr >/dev/null
          command -v wc >/dev/null
          test -r /dev/null
          test -r /dev/zero
          test -d /run/sshd
          test -x /usr/lib/openssh/sftp-server
          selected_sshd="$(command -v sshd 2>/dev/null || true)"
          if [ -z "$selected_sshd" ] && [ -f /usr/sbin/sshd ] && [ -x /usr/sbin/sshd ]; then
            selected_sshd=/usr/sbin/sshd
          fi
          if [ -z "$selected_sshd" ]; then
            echo "no executable sshd alternative is available" >&2
            exit 1
          fi
          test -f "$selected_sshd"
          test -x "$selected_sshd"
          echo "SSHD=$selected_sshd" >> "$GITHUB_ENV"

      - name: Install official golangci-lint prebuilt
        env:
          GOLANGCI_LINT_VERSION: "2.11.4"
        run: |
          set -euo pipefail
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          release="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          curl -sSfL "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$release/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" \
            -o "$RUNNER_TEMP/golangci-lint-checksums.txt"
          grep "  $archive\$" "$RUNNER_TEMP/golangci-lint-checksums.txt" \
            > "$RUNNER_TEMP/golangci-lint-selected-checksum.txt"
          (
            cd "$RUNNER_TEMP"
            sha256sum -c golangci-lint-selected-checksum.txt
          )
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 \
            "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" \
            "$RUNNER_TEMP/bin/golangci-lint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify CI profile
        run: go run ./cmd/verify ci

  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Verify native Windows fast profile
        run: go run ./cmd/verify fast
