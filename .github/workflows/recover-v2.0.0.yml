name: Recover v2.0.0 Release assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-Cd1s-ssm-v2.0.0-364882535
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'Cd1s/ssm' && github.ref == 'refs/heads/agent-headless-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 482b0d6522f660005c68666845b3162b2e6a7787
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Install recovery prerequisites
        run: sudo apt-get update && sudo apt-get install -y jq unzip
      - name: Recover exact missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Cd1s/ssm
          EXPECTED_SOURCE_SHA: 10417d0e235eff9b22081765b0ad17b75cf74990
          EXPECTED_RELEASE_ID: "364882535"
          EXPECTED_SOURCE_RUN_ID: "30911029600"
          REQUIRED_LATEST_ID: "364597135"
          REQUIRED_LATEST_TAG: v1.4.4
        run: |
          printf '%s  %s\n' \
            eb1f17cb24b9d2927e0421d7a15e54d651dfb5ac75f8fd109b3eb06482d6e5ad scripts/recover-v2.0.0-release.sh \
            db7c5d942aa0da8c16b68371dd5f2ca5428387bb12e3bc5978200606c6ddffa5 cmd/recoveryverify/main.go \
            | sha256sum -c -
          ./scripts/recover-v2.0.0-release.sh
