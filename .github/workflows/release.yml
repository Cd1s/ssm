name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.3'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must look like v1.2.3: $tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            # Annotated tags publish the tag object SHA; peel to the commit when present.
            remote_sha="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            fi
            current_sha="$(git rev-parse HEAD)"
            if [ "$remote_sha" != "$current_sha" ]; then
              echo "tag $tag already exists at $remote_sha, current commit is $current_sha" >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

          source_version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([0-9.]*\)"/\1/p' cmd/ssm/main.go)"
          if [ "$source_version" != "${tag#v}" ]; then
            echo "source version $source_version does not match release $tag" >&2
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=$VERSION" -o ssm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/ssm
      - uses: actions/upload-artifact@v7
        with:
          name: ssm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ssm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ssm-linux-* ssm-darwin-* ssm-windows-* install.sh > checksums.txt
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          header="## ${{ needs.prepare.outputs.tag }}"
          awk -v header="$header" '
            $0 == header { found=1; next }
            found && /^## v[0-9]/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' RELEASE_NOTES.md > release-body.md
          test -s release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-body.md
          make_latest: true
          files: |
            ssm-linux-*
            ssm-darwin-*
            ssm-windows-*
            install.sh
            checksums.txt
