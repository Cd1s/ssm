name: Release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Install verification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            coreutils \
            dash \
            findutils \
            gawk \
            grep \
            jq \
            openssh-client \
            openssh-server \
            sed \
            util-linux
          sudo install -d -m 0755 /run/sshd
          selected_sshd="$(command -v sshd 2>/dev/null || true)"
          if [ -z "$selected_sshd" ] && [ -f /usr/sbin/sshd ] && [ -x /usr/sbin/sshd ]; then
            selected_sshd=/usr/sbin/sshd
          fi
          if [ -z "$selected_sshd" ]; then
            echo "no executable sshd alternative is available" >&2
            exit 1
          fi
          echo "SSHD=$selected_sshd" >> "$GITHUB_ENV"

      - name: Install official golangci-lint prebuilt
        env:
          GOLANGCI_LINT_VERSION: "2.11.4"
        run: |
          set -euo pipefail
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          release="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          curl -sSfL "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$release/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" \
            -o "$RUNNER_TEMP/golangci-lint-checksums.txt"
          grep "  $archive\$" "$RUNNER_TEMP/golangci-lint-checksums.txt" \
            > "$RUNNER_TEMP/golangci-lint-selected-checksum.txt"
          (
            cd "$RUNNER_TEMP"
            sha256sum -c golangci-lint-selected-checksum.txt
          )
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 \
            "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" \
            "$RUNNER_TEMP/bin/golangci-lint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - id: release
        name: Validate release identity
        shell: bash
        env:
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected_workflow_ref="Cd1s/ssm/.github/workflows/release.yml@refs/tags/$tag"
          if [ "$RELEASE_WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "release workflow identity is not accepted: $RELEASE_WORKFLOW_REF" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "v2 release tag must look like v2.0.0: $tag" >&2
            exit 1
          fi
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          fi
          if [ -z "$remote_sha" ]; then
            echo "tag $tag does not resolve to a remote commit" >&2
            exit 1
          fi
          current_sha="$(git rev-parse HEAD)"
          if [ "$remote_sha" != "$current_sha" ]; then
            echo "tag $tag resolves to $remote_sha, current commit is $current_sha" >&2
            exit 1
          fi
          source_version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([0-9.]*\)"/\1/p' cmd/ssm/main.go)"
          if [ "$source_version" != "${tag#v}" ]; then
            echo "source version $source_version does not match release $tag" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release profile
        run: go run ./cmd/verify release

  build:
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: ssm-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ssm-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: ssm-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: ssm-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: ssm-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: ssm-windows-arm64.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Build verified release asset
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -buildvcs=false -ldflags="-s -w -X main.version=$VERSION" -o "${{ matrix.asset }}" ./cmd/ssm

      - id: provenance
        name: Attest exact release asset
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/${{ matrix.asset }}

      - name: Stage adjacent provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" "${{ matrix.asset }}.sigstore.json"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sigstore.json

  publish:
    permissions:
      contents: write
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum ssm-linux-amd64 ssm-linux-arm64 ssm-darwin-amd64 ssm-darwin-arm64 ssm-windows-amd64.exe ssm-windows-arm64.exe install.sh > checksums.txt

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          header="## ${{ needs.preflight.outputs.tag }}"
          awk -v header="$header" '
            $0 == header { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' RELEASE_NOTES.md > release-body.md
          grep -q '[^[:space:]]' release-body.md

      - name: Publish verified release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: false
          files: |
            ssm-linux-amd64
            ssm-linux-arm64
            ssm-darwin-amd64
            ssm-darwin-arm64
            ssm-windows-amd64.exe
            ssm-windows-arm64.exe
            ssm-linux-amd64.sigstore.json
            ssm-linux-arm64.sigstore.json
            ssm-darwin-amd64.sigstore.json
            ssm-darwin-arm64.sigstore.json
            ssm-windows-amd64.exe.sigstore.json
            ssm-windows-arm64.exe.sigstore.json
            install.sh
            checksums.txt
