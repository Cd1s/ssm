name: CI

on:
  push:
    branches: [agent-headless-sync, dev, main]
  pull_request:
    branches: [agent-headless-sync, dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          only-new-issues: true

      - name: Build
        run: go build ./cmd/ssm

      - name: Test
        run: go test ./...

      - name: Prepare SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd

      - name: SSH matrix
        run: scripts/ssh_matrix_test.sh
