name: CI

on:
  workflow_dispatch:
  push:
    branches: [agent-headless-sync, dev, main]
  pull_request:
    branches: [agent-headless-sync, dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        if: github.event_name != 'workflow_dispatch'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          only-new-issues: true

      - name: Lint (manual, changes since v1.2.0)
        if: github.event_name == 'workflow_dispatch'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --new-from-rev=v1.2.0

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build
        run: go build ./cmd/ssm

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Validate agent artifacts
        run: |
          jq empty skills/agent-ssm/test-prompts.json
          jq empty skills/agent-ssm/references/request-v1.schema.json
          bash -n scripts/ssh_matrix_test.sh

      - name: Prepare SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd

      - name: SSH matrix
        run: scripts/ssh_matrix_test.sh
