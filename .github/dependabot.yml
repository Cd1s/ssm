version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
      sigstore:
        patterns:
          - github.com/sigstore/*
          - sigs.k8s.io/release-utils
