schema: spec-driven

context: |
  Project: SSM, a Go CLI/TUI and headless sshctl tool for agent-managed SSH.
  Tech stack: Go 1.25.7, Bubble Tea/Lipgloss TUI, golang.org/x/crypto/ssh.
  Main package: cmd/ssm.
  Internal package boundaries:
    - internal/config: encrypted vault data model, config paths, settings, password cache.
    - internal/vault: Argon2id + AES-GCM encryption only.
    - internal/cloud: sync client for opaque encrypted vault blobs.
    - internal/syncserver: HTTP sync server that stores opaque encrypted blobs.
    - internal/ssh: SSH auth, exec, shell/session manager, host-key handling, file upload.
    - internal/update: GitHub release update checks and binary replacement.
  Verification commands:
    - go test ./...
    - go build ./cmd/ssm
    - scripts/ssh_matrix_test.sh when sshd/ssh/ssh-keygen are available.
  Secret-handling constraints:
    - Do not print vault plaintext, master passwords, sync tokens, bearer tokens, SSH private keys, or sensitive remote output.
    - Secret files must be 0600 and config/data directories must be 0700.
    - The sync server must never decrypt vault data.
    - Tests must not use production SSH hosts, real private keys, real tokens, or real vault plaintext.
    - Disable startup update checks in tests with SSM_UPDATE_REPO=off.

rules:
  proposal:
    - Identify the affected command or internal package boundary.
    - Call out user-facing compatibility impact for CLI/sshctl changes.
  design:
    - Include secret-safety and rollback notes for vault, sync, SSH, or update changes.
  tasks:
    - Include package-level tests for deterministic changes.
    - Include scripts/ssh_matrix_test.sh or documented manual verification for SSH behavior changes.
